[package]
name = "bite-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

# `bite-gui.exe`, the name the Windows installer ships and the file association points at.
[[bin]]
name = "bite-gui"
path = "src/main.rs"

[dependencies]
bite-imgui = { path = "../bite-imgui" }
bite-core.workspace = true
bite-schema.workspace = true
bite-expr.workspace = true
bite-imagemagick.workspace = true
serde_json.workspace = true
serde.workspace = true
winit = "0.30.13"
png = "0.18"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
arboard = "3.6.1"
ureq = "2.12.1"
image-webp = "0.2"
# The drawing API. Vendored (`vendor/sokol-rust`, floooh/sokol-rust @ b22a545) because the
# crates.io `sokol` name belongs to an unrelated crate from 2019. `build.rs` compiles
# `simgui/simgui.c` - Dear ImGui's sokol_gfx renderer - against the same headers.
sokol = { path = "../../vendor/sokol-rust" }

# The D3D11 device and DXGI flip-model swapchain sokol_gfx draws through (`render::d3d11`), and
# the staging-texture readback `--capture` reads its pixels back with (`render::readback`). The
# typed crate rather than raw `windows-sys` because these are COM calls. The feature list is what
# those two files use, plus the one call `platform.rs` makes to read the launch show command.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",          # D3D_DRIVER_TYPE / feature levels
    "Win32_Graphics_Direct3D11",        # ID3D11Device / context / render-target view
    "Win32_Graphics_Dxgi",              # IDXGIFactory2 / swapchain / device / adapter
    "Win32_Graphics_Dxgi_Common",       # DXGI_FORMAT / sample desc
    "Win32_System_Threading",           # GetStartupInfoW: the launch show command
] }

# The Metal device and `CAMetalLayer` sokol_gfx draws through (`render::metal`), the blit
# readback `--capture` reads pixels back with (`render::readback`), the menu bar, and the
# Finder-open hook. This is the **0.5/0.2** objc2 family, not the 0.6/0.3 one `rfd` and
# `arboard` pull: winit already depends on exactly these versions, so nothing new is resolved,
# and `muda` is on the same family. The feature lists are what these four files use - each crate
# gates every class behind one, so an omission is a missing type rather than a smaller build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSGeometry",                   # CGSize, for the layer's drawable size
    "NSArray",                      # the `openURLs:` argument
    "NSString",
    "NSURL",                        # what a Finder open arrives as
    "NSThread",                     # MainThreadMarker
] }
objc2-metal = { version = "0.2", features = [
    "MTLDevice",                    # MTLCreateSystemDefaultDevice: the device sokol_gfx runs on
    "MTLPixelFormat",               # the layer's BGRA8Unorm backbuffer format
    "MTLDrawable",                  # CAMetalDrawable's base protocol
    "MTLTexture",                   # the drawable's texture, and the capture's source
    "MTLResource",                  # storage modes
    "MTLBuffer",                    # the shared buffer a capture is blitted into
    "MTLCommandQueue",              # sokol's queue, which the capture's blit is encoded on
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLBlitCommandEncoder",        # texture -> buffer, the only way back from a private texture
    "MTLTypes",                     # MTLOrigin / MTLSize
] }
objc2-quartz-core = { version = "0.2", features = [
    "CALayer",                      # contentsScale, the layer the view hosts
    "CAMetalLayer",                 # the layer itself: device, format, nextDrawable
    "objc2-metal",                  # enables CAMetalLayer's MTLDevice-typed accessors
] }
objc2-app-kit = { version = "0.2", features = [
    "NSView",                       # setLayer:/setWantsLayer: on winit's view
    "NSResponder",                  # NSView's superclass chain
    "objc2-quartz-core",            # setLayer: takes a CALayer, so NSView needs the type
    "NSApplication",                # the delegate `openfiles` extends with openURLs:
] }
# The system menu bar. Without one a Mac app cannot be quit from the keyboard at all: Cmd+Q is
# the menu's, not the window's. Default features off - the tray icon and its image decoders are
# a third of the crate and nothing here wants them.
muda = { version = "0.19.3", default-features = false }
# `timing`'s macOS arm: proc_pidinfo for the process-creation clock, proc_pid_rusage for the
# footprint. The Windows arm calls GetProcessTimes for the same two numbers.
libc = "0.2"

[build-dependencies]
# Compiles `simgui/simgui.c`; see `compile_simgui` in build.rs.
cc = "1"
# Decodes the window icon to raw RGBA at build time (`decode_icon`), so no PNG decode happens on
# the launch path and a malformed asset is a build error rather than a missing icon. The runtime
# `png` dependency stays: `--capture` writes with it.
png = "0.18"
# build.rs reads the canonical product metadata from ../../product.json, so one edit there
# reaches the exe's version resource and the BITE_* compile-time strings the editor shows.
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Embeds build/icon.ico plus the product metadata into the exe, so Explorer, the taskbar and
# the file-properties version tab all show them.
winresource = "0.1"
