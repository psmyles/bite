[package]
name = "bite-imagemagick"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bite-core.workspace = true
bite-expr.workspace = true
serde.workspace = true
fire-decode.workspace = true
image-webp.workspace = true

# HEIC / HEIF / AVIF in process where fire-decode has the libraries for it (the workspace
# manifest says why only there).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
fire-decode = { workspace = true, features = ["heif"] }

[dev-dependencies]
png = "0.18"
