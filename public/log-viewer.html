<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imgplex — Log</title>
    <style>
      @font-face {
        font-family: 'JetBrainsMono';
        src: url('./JetBrainsMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #141414;
        color: #e0e0e0;
        font-family: 'JetBrainsMono', ui-monospace, monospace;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      #toolbar {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 8px 14px;
        background: #1e1e1e;
        border-bottom: 1px solid #2e2e2e;
        flex-shrink: 0;
      }

      #toolbar .label {
        color: #666;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      #btn-clear {
        margin-left: auto;
        background: none;
        border: 1px solid #333;
        border-radius: 3px;
        color: #666;
        font-family: inherit;
        font-size: 11px;
        padding: 2px 8px;
        cursor: pointer;
        letter-spacing: 0.04em;
      }

      #btn-clear:hover {
        border-color: #555;
        color: #aaa;
      }

      .filter-label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
        font-size: 11px;
      }

      .filter-label input[type='checkbox'] {
        accent-color: #555;
        width: 13px;
        height: 13px;
        cursor: pointer;
      }

      .filter-label.info {
        color: #aaa;
      }

      .filter-label.warn {
        color: #f0c040;
      }

      .filter-label.error {
        color: #e05a5a;
      }

      #log-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      .entry {
        display: flex;
        gap: 10px;
        padding: 2px 14px;
        line-height: 1.55;
      }

      .entry:hover {
        background: #1c1c1c;
      }

      .ts {
        color: #777;
        flex-shrink: 0;
        font-size: 11px;
        padding-top: 1px;
        white-space: nowrap;
      }

      .badge {
        flex-shrink: 0;
        width: 36px;
        font-size: 10px;
        letter-spacing: 0.04em;
        padding-top: 1px;
        white-space: nowrap;
      }

      .entry.info .badge {
        color: #777;
      }

      .entry.warn .badge {
        color: #f0c040;
      }

      .entry.error .badge {
        color: #e05a5a;
      }

      .msg {
        flex: 1;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .msg .tag {
        color: #02ccff;
      }

      .entry.info .msg {
        color: #e0e0e0;
      }

      .entry.warn .msg {
        color: #f0c040;
      }

      .entry.error .msg {
        color: #e05a5a;
      }

      body.hide-info .entry.info {
        display: none;
      }

      body.hide-warn .entry.warn {
        display: none;
      }

      body.hide-error .entry.error {
        display: none;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #444;
      }
    </style>
  </head>

  <body>
    <div id="toolbar">
      <span class="label">Filter</span>
      <label class="filter-label info"> <input type="checkbox" data-level="info" checked /> Info </label>
      <label class="filter-label warn"> <input type="checkbox" data-level="warn" checked /> Warning </label>
      <label class="filter-label error"> <input type="checkbox" data-level="error" checked /> Error </label>
      <button id="btn-clear">Clear</button>
    </div>
    <div id="log-list"></div>

    <script>
      const logList = document.getElementById('log-list');

      document.querySelectorAll('#toolbar input[type="checkbox"]').forEach((cb) => {
        cb.addEventListener('change', () => {
          document.body.classList.toggle('hide-' + cb.dataset.level, !cb.checked);
        });
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        logList.innerHTML = '';
      });

      function formatTs(iso) {
        return iso.slice(11, 23); // HH:MM:SS.mmm
      }

      function appendEntry(entry) {
        const atBottom = logList.scrollHeight - logList.scrollTop - logList.clientHeight < 40;

        const div = document.createElement('div');
        div.className = 'entry ' + entry.level;

        const ts = document.createElement('span');
        ts.className = 'ts';
        ts.textContent = formatTs(entry.ts);

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = entry.level.toUpperCase();

        const msg = document.createElement('span');
        msg.className = 'msg';
        const tagMatch = entry.msg.match(/^(\[[^\]]+\])([\s\S]*)/);
        if (tagMatch) {
          const tagSpan = document.createElement('span');
          tagSpan.className = 'tag';
          tagSpan.textContent = tagMatch[1];
          msg.appendChild(tagSpan);
          msg.appendChild(document.createTextNode(tagMatch[2]));
        } else {
          msg.textContent = entry.msg;
        }

        div.appendChild(ts);
        div.appendChild(badge);
        div.appendChild(msg);
        logList.appendChild(div);

        if (atBottom) logList.scrollTop = logList.scrollHeight;
      }

      window.ipcRenderer.invoke('log:get-entries').then((entries) => {
        for (const entry of entries) appendEntry(entry);
        logList.scrollTop = logList.scrollHeight;
      });

      window.ipcRenderer.on('log:entry', (_event, entry) => {
        appendEntry(entry);
      });
    </script>
  </body>
</html>
