[workspace]
resolver = "2"
members = ["crates/bite-schema", "crates/bite-expr", "crates/bite-core", "crates/bite-imagemagick", "crates/bite-cli", "crates/bite-imgui-sys", "crates/bite-imgui", "crates/bite-gui", "xtask"]
# `vendor/sokol-rust` is a pinned upstream copy, not our code, but it sits inside the workspace
# directory and cargo makes any path dependency there a member automatically - which puts it in
# `--workspace`, and so under clippy's gaze, failing on upstream's own style. Declaring it
# excluded is what stops that; it is still built exactly as before, as a path dependency of
# `bite-gui`.
exclude = ["vendor/sokol-rust"]

# The product version, and what the GUI's update check compares against the latest
# GitHub release. It was carried over from the package manifest the Electron build used.
[workspace.package]
version = "0.5.4"
edition = "2021"
license = "MIT"
# fire-decode's floor (its `rust-version`): thumbnails and cached reads decode through it.
# Every crate inherits it (`rust-version.workspace = true`), so the floor is one number.
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
bite-schema = { path = "crates/bite-schema" }
bite-expr = { path = "crates/bite-expr" }
bite-core = { path = "crates/bite-core" }
bite-imagemagick = { path = "crates/bite-imagemagick" }
# The shared decoder (fire-decode plan, step 5): thumbnails of PNG, TGA, PSD, EXR, HEIC, HEIF and
# AVIF, every file's size, and every cached thumbnail read. `psd` brings psd_sdk (compiled from
# source). No `icc` (bite does no colour management) and no `raw` (camera raw stays on
# ImageMagick, which develops it). `heif` - the libheif / libde265 / dav1d static libraries,
# LGPL-3.0-or-later for the first two, linked under the relink terms in THIRD_PARTY_LICENSES - is
# turned on per crate for Windows and macOS only: fire-decode has those libraries for no other
# target, and the CLI still builds on Linux, where HEIC goes to ImageMagick. A release tag, which
# Cargo.lock records; moving to a new release is this tag and `cargo update -p fire-decode`. The
# release sets the decoders' versions too: fire-decode pins each one exactly, so Cargo.lock takes
# them from the tag, and `png`, `image`, `image-webp` and `libwebp-sys` here follow. Nothing
# outside this repository decides where it comes from: no `.cargo/config.toml` above it patches
# it. To try an unreleased fire-decode, patch it for one command only, from a checkout beside
# this one:
#   cargo build --config 'patch."https://github.com/psmyles/fire-decode".fire-decode.path="../fire-decode/crates/fire-decode"'
# That writes the path into Cargo.lock: `git checkout Cargo.lock` afterwards, and never commit a
# lock it wrote (a `--locked` build refuses one).
fire-decode = { git = "https://github.com/psmyles/fire-decode", tag = "v0.1.1", features = ["psd"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Decoding and encoding are almost all third party, and unoptimized they are slow enough to
# be felt: a folder of thumbnails took ten times as long to decode in a development build.
# Our own crates stay unoptimized, so a debug build still steps and reads as one.
[profile.dev.package."*"]
opt-level = 2
